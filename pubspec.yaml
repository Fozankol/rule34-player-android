name: rule34_player
description: A high-performance Rule34 video player with client-side fast duration filtering, reels player, and offline manager.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: ">=3.10.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  http: ^1.2.0
  dio: ^5.4.1
  provider: ^6.1.2
  video_player: ^2.8.2
  sqflite: ^2.3.2
  path: ^1.9.0
  shared_preferences: ^2.2.2
  path_provider: ^2.1.2
  cached_network_image: ^3.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  test: ^1.24.9

flutter:
  uses-material-design: true
